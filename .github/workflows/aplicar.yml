name: Aplicar mudancas
on:
  push:
    paths: [".github/workflows/aplicar.yml"]
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: |
          for f in partes/parte*.sh; do bash -e "$f"; done
          git apply /tmp/mudancas.patch
          git rm -rqf partes .github/workflows/aplicar.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Configuracoes do laboratorio, logo e nota impressa"
          git push
