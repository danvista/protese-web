name: Aplicar mudancas
on:
  push:
    paths: [".github/workflows/aplicar.yml"]
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patches
        run: |
          printf ' \n' >> partes/p2.patch
          git apply partes/p1.patch partes/p2.patch
          git rm -rq partes .github/workflows/aplicar.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Categorias de serviço"
          git push
