name: Montar site
on:
  push:
    paths: [".github/workflows/montar.yml"]
permissions:
  contents: write
jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar arquivos
        run: |
          for f in partes/parte*.sh; do bash -e "$f"; done
          git rm -rq partes .github/workflows/montar.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ordens de serviço e novo visual com animações"
          git push
