<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fatura | Protese Web</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="carregando pagina-nota">
  <!-- Barra de ações (não sai na impressão) -->
  <div class="nota-acoes nao-imprimir">
    <a href="financeiro.html" class="btn btn-outline-secondary btn-sm" id="btn-voltar"><i class="bi bi-arrow-left"></i> Financeiro</a>
    <div class="form-check form-switch mb-0">
      <input class="form-check-input" type="checkbox" role="switch" id="mostrar-servicos" checked>
      <label class="form-check-label small" for="mostrar-servicos">Detalhar serviços</label>
    </div>
    <button type="button" class="btn btn-primary btn-sm" id="btn-imprimir"><i class="bi bi-printer"></i> Imprimir / salvar PDF</button>
  </div>

  <article class="nota fatura" id="fatura">
    <div class="text-center text-secondary py-5">Carregando...</div>
  </article>

  <script type="module" src="js/paginas/fatura.js"></script>
</body>
</html>
